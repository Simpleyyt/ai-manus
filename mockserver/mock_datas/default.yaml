# Canned Agent responses follow the single-loop Manus tool protocol:
# message_notify + todo.md (file_write) projects plan progress, work tools
# perform the task, and deliver_result returns the final user-facing result.
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: message_notify_user
              arguments: |
                {
                    "text": "Starting the mock Agent task."
                }
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: file_write
              arguments: |
                {
                  "file": "/home/ubuntu/todo.md",
                  "content": "# Plan\n- [~] Run the mock Agent task\n",
                  "append": false
                }

- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: message_notify_user
              arguments: |
                {
                    "text": "test message tools."
                }
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: info_search_web
              arguments: |
                {
                    "query": "latest AI developments 2024",
                    "date_range": "past_month"
                }
      finish_reason: stop
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: file_write
              arguments: |
                {
                    "file": "/home/ubuntu/example.txt",
                    "content": "New content\nSecond line",
                    "append": false,
                    "leading_newline": true,
                    "trailing_newline": true
                }
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: file_write
              arguments: |
                {
                    "file": "/home/ubuntu/example.md",
                    "content": "## Header\n\nThis is a test\n\n### Subheader",
                    "append": false,
                    "leading_newline": true,
                    "trailing_newline": true
                }
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: file_write
              arguments: |
                {
                    "file": "/home/ubuntu/example.py",
                    "content": "print('Hello, World!')",
                    "append": false,
                    "leading_newline": true,
                    "trailing_newline": true
                }
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: shell_exec
              arguments: |
                {
                    "id": "shell-1",
                    "exec_dir": "/home/ubuntu",
                    "command": "ls -a"
                }
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: browser_navigate
              arguments: |
                {
                    "url": "https://www.example.com"
                }

- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: file_write
              arguments: |
                {
                  "file": "/home/ubuntu/todo.md",
                  "content": "# Plan\n- [x] Run the mock Agent task\n",
                  "append": false
                }

- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: deliver_result
              arguments: |
                {
                  "message": "This is a test",
                  "attachments": [
                    "/home/ubuntu/example.txt",
                    "/home/ubuntu/example.md",
                    "/home/ubuntu/example.py"
                  ]
                }
