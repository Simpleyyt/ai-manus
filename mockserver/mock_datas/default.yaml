# Canned Agent responses follow the single-loop Manus tool protocol:
# todo_write projects plan progress, work tools perform the task, and
# deliver_result returns the final user-facing result.
- choices:
    - index: 0
      message:
        role: assistant
        content: null
        tool_calls:
          - type: function
            function:
              name: todo_write
              arguments: |
                {
                  "items": [
                    {
                      "id": "1",
                      "content": "Run the mock Agent task",
                      "status": "in_progress"
                    }
                  ]
                }

