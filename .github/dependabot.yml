version: 2

updates:
  - package-ecosystem: "uv"
    directories:
      - "/backend"
      - "/sandbox"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/mockserver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/sandbox"
      - "/mockserver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
